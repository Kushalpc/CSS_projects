<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Music</title>
    <link rel="stylesheet" href="./style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="container">
        <div class="top">
            <a href="" class="top_icons">
                <i class='bx bx-chevron-down'></i>
            </a>
            <div class="buttons">
                <span> <button class="top_buttons" type="button">Song</button></span>
                <span> <button class="top_buttons">Video</button></span>


            </div>

            <a href="" class="top_icons">
                <i class='bx bx-dots-vertical-rounded'></i>
            </a>
        </div>
        <div class="image_container">
            <img src="./sakura.JPEG" alt="" class="image">
        </div>

        <div class="song_artist">
            <div class="song">Sakura</div>
            <div class="artist">Ethan Kesari</div>
        </div>

        <div class="row_pill">

            <div class="pill">
                <i class='bx bx-like'></i>
                <span class="number">8.3K</span>
            </div>
            <div class="pill">
                <i class='bx bx-dislike'></i>
            </div>
            <div class="pill">
                <i class='bx bx-comment'></i>
                <span class="number">75</span>
            </div>
            <div class="pill">
                <i class='bx bx-message-alt-add'></i>
                <span class="number">Save</span>
            </div>
        </div>

        <div class="slider">
            <label for="slide"></label>
            <input type="range" name="" id="slide" max="100" min="0" value="20" class="slide">
        </div>

        <div class="timestamp">
            <span class="time">0:08</span>
            <span class="time">1:05</span>
        </div>

        <div class="footer">
            <div class="footer_icons">
                <i class='bx bx-transfer-alt'></i>
            </div>

            <div class="footer_icons">
                <i class='bx bx-left-arrow'></i>
            </div>

            <div class="footer_icons">
                <i class='bx bx-pause-circle'></i>
            </div>

            <div class="footer_icons">
                <i class='bx bx-right-arrow'></i>
            </div>

            <div class="footer_icons">
                <i class='bx bx-repeat'></i>
            </div>
        </div>
    </div>
</body>

</html>
